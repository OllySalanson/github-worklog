# Rebuilds and publishes the password-protected work log every evening at
# 22:00 UK time, and whenever it is run by hand from the Actions tab.
# Setup: see "Publish every evening with GitHub Actions" in the README.
name: Publish work log

on:
  schedule:
    # 22:00 in London is 21:00 UTC in summer time (BST) and 22:00 UTC in
    # winter (GMT). Both run, and the "when" step keeps only the one that
    # matches today's offset, so a late start never publishes twice.
    - cron: '0 21 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

# Pushes the encrypted page to gh-pages and checks the Pages setting.
permissions:
  contents: write
  pages: read

concurrency:
  group: publish-work-log
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: When
        id: when
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          HAS_CONFIG: ${{ secrets.WORKLOG_CONFIG != '' }}
        run: |
          if [ "$HAS_CONFIG" != true ]; then
            echo "::notice::The WORKLOG_CONFIG secret is not set, so there is nothing to publish. See the README to set it up."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = schedule ]; then
            offset=$(TZ=Europe/London date +%z)
            if { [ "$offset" = +0100 ] && [ "$SCHEDULE" != '0 21 * * *' ]; } ||
               { [ "$offset" = +0000 ] && [ "$SCHEDULE" != '0 22 * * *' ]; }; then
              echo "Not 22:00 in London for this schedule (London is at UTC$offset). Skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.when.outputs.run == 'true'
        with:
          node-version: 22

      # Secrets are only ever held in environment variables and handed to the
      # command through pipes, so nothing private touches the runner's disk.
      - name: Publish
        if: steps.when.outputs.run == 'true'
        shell: bash
        env:
          # Reads the listed repositories.
          GH_TOKEN: ${{ secrets.WORKLOG_TOKEN }}
          # Pushes to this repository only.
          GITHUB_WORKLOG_PUBLISH_TOKEN: ${{ github.token }}
          WORKLOG_PASSWORD: ${{ secrets.WORKLOG_PASSWORD }}
          WORKLOG_CONFIG: ${{ secrets.WORKLOG_CONFIG }}
          # Older setups kept the other work in a secret, which is too small.
          HAS_OLD_ACTIVITIES: ${{ secrets.WORKLOG_ACTIVITIES != '' }}
        run: |
          set -euo pipefail
          for name in GH_TOKEN WORKLOG_PASSWORD; do
            if [ -z "${!name}" ]; then
              [ "$name" = GH_TOKEN ] && name=WORKLOG_TOKEN
              echo "::error::The $name secret is not set. See the README."
              exit 1
            fi
          done
          # Check the JSON without echoing it: jq's errors name a line and
          # column, never the contents.
          printf '%s' "$WORKLOG_CONFIG" | jq -e 'type == "object"' > /dev/null ||
            { echo "::error::WORKLOG_CONFIG is not a JSON object."; exit 1; }
          if [ "$HAS_OLD_ACTIVITIES" = true ]; then
            echo "::warning::The WORKLOG_ACTIVITIES secret is no longer used: publish now stores your other work, encrypted, with the page. Delete the secret."
          fi
          # GitHub hides whole secrets in the log, but not the pieces of a JSON
          # one, so hide each private text value in it too.
          private='.. | objects | to_entries[] | select(.key | IN("timeZone", "dayStartsAt", "since", "requireActivityTimesFrom") | not) | .value | .. | strings'
          printf '%s' "$WORKLOG_CONFIG" | jq -r "$private" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done
          # "activities" in the config is a path on your own machine; here the
          # other work is the encrypted copy that the last publish stored with
          # the page, which github-worklog unlocks with the password and hides
          # in the log itself.
          node bin/github-worklog.js publish \
            --config <(printf '%s' "$WORKLOG_CONFIG" | jq 'del(.activities)') \
            --password-file <(printf '%s' "$WORKLOG_PASSWORD") \
            --stored-activities \
            --repo "$GITHUB_REPOSITORY"
