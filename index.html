<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Work log</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1b1f24;
  --muted: #5d6671;
  --border: #e2e5e9;
  --accent: #0b62c4;
  --danger: #b42318;
  --added: #1a7f37;
  --removed: #d1242f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418;
    --surface: #1a1e24;
    --text: #e6e9ed;
    --muted: #9aa3ad;
    --border: #2c323a;
    --accent: #6cb2ff;
    --danger: #ff8a80;
    --added: #3fb950;
    --removed: #f85149;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
a { color: var(--accent); }
button { font: inherit; }

main { padding-top: 18vh; max-width: 24rem; }
h1 { font-size: 1.4rem; margin: 0 0 .35rem; }
p { color: var(--muted); margin: 0 0 1.25rem; }
form { display: grid; gap: .8rem; }
form[hidden] { display: none; }
input[type=password] {
  font: inherit;
  width: 100%;
  padding: .7rem .8rem;
  border: 1px solid var(--border);
  border-radius: .5rem;
  background: var(--surface);
  color: var(--text);
}
input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
label.remember { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .95rem; }
label.remember input { width: 1.05rem; height: 1.05rem; margin: 0; accent-color: var(--accent); }
.unlock {
  padding: .7rem;
  border: 0;
  border-radius: .5rem;
  background: var(--accent);
  color: var(--bg);
  font-weight: 600;
  cursor: pointer;
}
.unlock:disabled { opacity: .6; cursor: progress; }
.message { min-height: 1.5em; margin: .8rem 0 0; font-size: .95rem; color: var(--muted); }
.message.error { color: var(--danger); }
</style>
</head>

<script>// Runs in the browser on the lock page. It is inlined into the page as-is, so
// it must stay plain, dependency-free script. The tests load it in Node too.
(function () {
  'use strict';

  var STORAGE_PREFIX = 'github-worklog:';

  function fromBase64(text) {
    var binary = atob(text);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function toBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var binary = '';
    for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  async function deriveKey(password, payload) {
    var material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, [
      'deriveKey',
    ]);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', hash: 'SHA-256', salt: fromBase64(payload.salt), iterations: payload.iterations },
      material,
      { name: 'AES-GCM', length: 256 },
      true,
      ['decrypt'],
    );
  }

  async function decrypt(key, payload) {
    var plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: fromBase64(payload.iv) },
      key,
      fromBase64(payload.data),
    );
    return new TextDecoder().decode(plain);
  }

  function storage() {
    try {
      return window.localStorage;
    } catch (e) {
      return null;
    }
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  async function start() {
    var payload = JSON.parse(document.getElementById('payload').textContent);
    var storageKey = STORAGE_PREFIX + payload.salt;
    var store = storage();
    var form = document.getElementById('unlock');
    var input = document.getElementById('password');
    var remember = document.getElementById('remember');
    var button = form.querySelector('button');
    var message = document.getElementById('message');

    var saved = null;
    try {
      saved = store && store.getItem(storageKey);
    } catch (e) {}
    if (saved) {
      try {
        var savedKey = await crypto.subtle.importKey('raw', fromBase64(saved), 'AES-GCM', false, ['decrypt']);
        show(await decrypt(savedKey, payload));
        return;
      } catch (e) {
        // The password changed since this device remembered it.
        try {
          store.removeItem(storageKey);
        } catch (e2) {}
      }
    }

    form.hidden = false;
    input.focus();
    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      if (!input.value) return;
      button.disabled = true;
      message.textContent = 'Unlocking…';
      message.className = 'message';
      try {
        var key = await deriveKey(input.value, payload);
        var html = await decrypt(key, payload);
        if (remember.checked && store) {
          try {
            store.setItem(storageKey, toBase64(await crypto.subtle.exportKey('raw', key)));
          } catch (e) {}
        }
        show(html);
      } catch (e) {
        button.disabled = false;
        message.textContent = 'That password did not work. Please try again.';
        message.className = 'message error';
        input.select();
      }
    });
  }

  globalThis.githubWorklogUnlock = { deriveKey: deriveKey, decrypt: decrypt };
  if (typeof document !== 'undefined' && document.getElementById('payload')) {
    if (!globalThis.crypto || !crypto.subtle) {
      document.getElementById('message').textContent = 'This browser cannot unlock the page. Please open it over https in an up-to-date browser.';
    } else if (document.readyState === 'loading') {
      // Replacing the document only works once the browser has finished parsing it.
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  }
})();
</script>
